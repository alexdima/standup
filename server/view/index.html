<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>Monaco Standup Page</title>

  <meta name="color-scheme" content="dark light">

  <link href="lib/codicons/codicon.css" rel="stylesheet">
  <script src="lib/jquery/jquery-1.11.0.min.js"></script>

  <link href="style.css" rel="stylesheet">
  <script src="appearance.js"></script>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Require.js -->
  <script data-main="scripts/main" src="lib/requirejs/require.js"></script>

  <!-- Main -->
  <script>
    require.config({
      shim: {
        'socketio': {
          exports: 'io'
        },
        'jquery': {
          exports: '$'
        },
      },
      paths: {
        socketio: '../socket.io/socket.io',
        jquery: '/lib/jquery/jquery-1.11.0.min',
      },
      baseUrl: '/',
    });

    var formatDate = (function () {
      var d_names = new Array("Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday");
      var m_names = new Array("January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December");

      return function (d) {
        var curr_day = d.getDay();
        var curr_date = d.getDate();
        var sup = "";
        if (curr_date == 1 || curr_date == 21 || curr_date == 31) {
          sup = "st";
        } else if (curr_date == 2 || curr_date == 22) {
          sup = "nd";
        } else if (curr_date == 3 || curr_date == 23) {
          sup = "rd";
        } else {
          sup = "th";
        }

        var curr_month = d.getMonth();
        var curr_year = d.getFullYear();

        return (d_names[curr_day] + ", " + curr_date + "<SUP>" + sup + "</SUP> " + m_names[curr_month] + " " + curr_year);
      };
    })();

    require(['main', 'jquery'], function (main, jquery) {

      // Date
      $('#navdate').html(formatDate(new Date()));

      // Background Image
      $.ajax({
        url: "/image",
      }).done(function (data) {
        if (data && data.url) {
          var url = data.url;

          $(document.body).css({
            backgroundImage: 'url(' + url + ')'
          });
          StandupAppearance.setBackgroundImage(url, data.label, data.sourceUrl);
        } else {
          console.error('Background image metadata is unavailable');
        }
      }).fail(function () {
        console.error('Unable to load background image metadata');
      });
    });
  </script>
</head>

<body>

  <!-- Title Bar
    ================================================== -->
  <header class="titlebar floating-surface">
    <div class="titlebar-left">
      <span class="codicon codicon-calendar" aria-hidden="true"></span>
      <span class="titlebar-title" id="navdate"></span>
    </div>
    <div class="titlebar-right">
      <a class="action-item" href="https://stand.scm.azurewebsites.net/dev/wwwroot/config.js" target="_blank"
        title="Edit Configuration" aria-label="Edit Configuration"><span class="codicon codicon-edit"
          aria-hidden="true"></span></a>
      <button type="button" class="action-item" id="appearance-toggle" title="Appearance" aria-label="Appearance"
        aria-haspopup="dialog" aria-expanded="false" aria-controls="appearance-popover">
        <span class="codicon codicon-settings-gear" aria-hidden="true"></span>
      </button>
      <div class="settings-popover" id="appearance-popover" role="dialog" aria-label="Appearance" hidden>
        <fieldset class="setting">
          <legend class="setting-label">Theme</legend>
          <div class="segmented-control">
            <label><input type="radio" name="theme" value="light"><span>Light</span></label>
            <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
            <label><input type="radio" name="theme" value="system"><span>System</span></label>
          </div>
        </fieldset>
        <div class="setting">
          <label class="setting-label" for="appearance-transparency">
            <span>Panel transparency</span>
            <output id="appearance-transparency-value" for="appearance-transparency"></output>
          </label>
          <input type="range" class="monaco-slider" id="appearance-transparency" min="0" max="60" step="5">
        </div>
        <label class="setting setting-checkbox">
          <input type="checkbox" class="monaco-checkbox" id="appearance-tint">
          <span>Tint with background image colors</span>
        </label>
      </div>
    </div>
  </header>

  <!-- List of Stage
    ================================================== -->
  <main class="panel floating-surface">
    <div class="toolbar" role="toolbar" aria-label="Standup Controls">
      <div class="toolbar-controls">
        <button type="button" class="monaco-button" id="start" title="Start Standup">
          <span class="codicon codicon-debug-start" aria-hidden="true"></span><span>Start</span>
        </button>
        <div class="actions">
          <button type="button" class="action-item" id="previous" title="Previous Speaker" aria-label="Previous Speaker">
            <span class="codicon codicon-arrow-left" aria-hidden="true"></span>
          </button>
          <button type="button" class="action-item" id="next" title="Next Speaker" aria-label="Next Speaker">
            <span class="codicon codicon-arrow-right" aria-hidden="true"></span>
          </button>
          <button type="button" class="action-item stop" id="stop" title="Stop Standup" aria-label="Stop Standup">
            <span class="codicon codicon-debug-stop" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <span class="blobby"><img id="blobby" src="/blobby/setup.png" width="28" height="28" alt=""></span>
    </div>
    <div id="stage" class="monaco-list" role="list" aria-label="Speakers"></div>
  </main>

  <footer class="image-footer floating-surface" id="image-footer" aria-label="Background image" hidden>
    <span class="image-credit" id="image-credit"></span>
    <a class="image-source" id="image-source" target="_blank" rel="noopener noreferrer">
      Source <span class="codicon codicon-link-external" aria-hidden="true"></span>
    </a>
  </footer>

</body>

</html>
